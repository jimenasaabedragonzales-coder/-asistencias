<section class="space-y-6">
    <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div>
                <p class="text-sm font-semibold uppercase tracking-wide text-cyan-700">Administración</p>
                <h3 class="mt-1 text-2xl font-bold text-slate-950">Estudiantes</h3>
                <p class="mt-2 text-sm text-slate-600">Listado de estudiantes registrados en el sistema.</p>
            </div>
            <button id="ReloadStudents" type="button" class="rounded-md bg-cyan-700 px-4 py-2 text-sm font-semibold text-white hover:bg-cyan-800">
                Actualizar lista
            </button>
        </div>
    </div>

    <div class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200 text-sm">
                <thead class="bg-slate-50 text-left text-xs font-bold uppercase tracking-wide text-slate-500">
                    <tr>
                        <th class="px-4 py-3">ID</th>
                        <th class="px-4 py-3">Nombre</th>
                        <th class="px-4 py-3">Apellido</th>
                        <th class="px-4 py-3">Dirección</th>
                        <th class="px-4 py-3">Teléfono</th>
                    </tr>
                </thead>
                <tbody id="StudentsTableList" class="divide-y divide-slate-100 bg-white">
                    <tr><td colspan="5" class="px-4 py-6 text-center text-slate-500">Cargando estudiantes...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
